<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1e0ca6"
    >

    <meta
        name="description"
        content="Aplicativo WebClima para consultar informações meteorológicas."
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <script
        src="https://kit.fontawesome.com/324b71f187.js"
        crossorigin="anonymous"
    ></script>

    <script
        src="./ClimaApi.js"
        defer
    ></script>

    <title>WebClima</title>
</head>

<body>
    <main>
        <section
            class="weather-card"
            aria-label="Consulta do clima"
        >

            <label for="weather-search">
                <i class="fas fa-map-marker-alt"></i>

                <input
                    id="weather-search"
                    class="weather-search"
                    type="search"
                    placeholder="Nome da cidade"
                    autocomplete="off"
                >
            </label>

<button
    id="location-button"
    class="location-button"
    type="button"
>
    <i class="fas fa-location-crosshairs"></i>
    Usar minha localização
</button>

            <img
                id="weather-image"
                class="weather-image"
                src="https://openweathermap.org/img/wn/11d@4x.png"
                alt="Imagem representando as condições climáticas"
            >

            <div
                id="weather-temperature"
                class="weather-temperature"
            >
                0 °C
            </div>

            <div
                id="weather-city"
                class="weather-city"
            >
                Cidade
            </div>

            <div class="weather-details">

                <div class="detail">
                    <i class="fas fa-water"></i>

                    <span>
                        <p
                            id="humidity"
                            class="detail-text"
                        >
                            100%
                        </p>

                        <p>Umidade</p>
                    </span>
                </div>

                <div class="detail">
                    <i class="fas fa-wind"></i>

                    <span>
                        <p
                            id="wind"
                            class="detail-text"
                        >
                            23 KM/h
                        </p>

                        <p>Vento</p>
                    </span>
                </div>

            </div>
        </section>
    </main>
</body>

</html>
